function loadStudentDropdowns() {
    onValue(studentsRef, (snapshot) => {

            "assessmentStudentSelect",

window.searchStudent = async function() {
    const term = document.getElementById("studentSearch").value.toLowerCase();
    
    const snapshot = await get(studentsRef);
    const data = snapshot.val() || {};
    
    const listDiv = document.getElementById("studentList");
    listDiv.innerHTML = "";
    
    Object.keys(data).forEach(id => {
        const stu = data[id];
        if (stu.studentName.toLowerCase().includes(term) || stu.studentID.includes(term)) {
            const div = document.createElement("div");
            div.textContent = `${stu.studentName} (${stu.studentID}) - Class: ${stu.studentClass}`;
            listDiv.appendChild(div);
        }
    });
};

// ✅ Save Result + Auto-Calculate
window.saveResult = async function() {
    
    const id = resultStudentSelect.value;
    const term = termSelect.value;
    const subject = subjectName.value.trim();
    const score = Number(subjectScore.value);
    const comment = teacherComment.value;
    
    if (!id || !subject || isNaN(score)) {
        return alert("Invalid data");
    }
    
    try {
        // ✅ Save subject score
        const termRef = ref(db, `students/${id}/results/${term}/subjects`);
        
        await update(termRef, {
            [subject]: score
        });
        
        // ✅ Get updated subjects safely (FIXED: removed onValue)
        const snapshot = await get(termRef);
        const subjects = snapshot.val() || {};
        
        const scores = Object.values(subjects);
        
        if (scores.length === 0) return;
        
        const total = scores.reduce((a, b) => a + b, 0);
        const average = total / scores.length;
        
        // ✅ Grade logic
        let grade = "F";
        if (average >= 75) grade = "A";
        else if (average >= 65) grade = "B";
        else if (average >= 55) grade = "C";
        else if (average >= 45) grade = "D";
        
        // ✅ Save summary
        await update(ref(db, `students/${id}/results/${term}`), {
            average: average.toFixed(2),
            grade: grade,
            comment: comment
        });
        
        // ✅ Insight FIX (no more "t" error)
        document.getElementById("insightBox").textContent =
            generateInsight(average);
        
        alert("Result saved & calculated");
        
        displayResults();
        
        // ✅ Send email
        emailjs.send("service_q5c4ig3", "template_hqu62kk", {
                student_name: resultStudentSelect.options[resultStudentSelect.selectedIndex].text,
                term: term,
                average: average.toFixed(2),
                grade: grade,
                parent_email: "parent@email.com"
            })
            .then(() => {
                console.log("Email sent successfully");
            })
            .catch(err => {
                console.error("Email failed", err);
            });
        
    } catch (error) {
        console.error(error);
        alert("Error saving result");
    }
};

// ✅ DELETE RESULT (recalculate after delete)
window.deleteResult = async function(id, term, subject) {
    
    if (confirm("Delete this result?")) {
        
        const termRef = ref(db, `students/${id}/results/${term}/subjects`);
        
        await remove(ref(db, `students/${id}/results/${term}/subjects/${subject}`));
        
        
        // ✅ Recalculate after delete
        const snapshot = await get(termRef);
        const subjects = snapshot.val() || {};
        
        const scores = Object.values(subjects);
        
        if (scores.length > 0) {
            const total = scores.reduce((a, b) => a + b, 0);
            const average = total / scores.length;
            
            let grade = "F";
            if (average >= 75) grade = "A";
            else if (average >= 65) grade = "B";
            else if (average >= 55) grade = "C";
            else if (average >= 45) grade = "D";
            
            await update(ref(db, `students/${id}/results/${term}`), {
                average: average.toFixed(2),
                grade: grade
            });
            
        } else {
            // If no subjects left
            await remove(ref(db, `students/${id}/results/${term}`));
        }
        
        alert("Deleted");
        displayResults();
    }
};

// ✅ Display Results with Edit/Delete
async function displayResults() {
    const id = resultStudentSelect.value;
    if (!id) return;
    
    const resDiv = document.getElementById("resultsList");
    resDiv.innerHTML = "";
    
    const studentRef = ref(db, `students/${id}/results`);
    
    const snapshot = await get(studentRef);
    const data = snapshot.val() || {};
    
    Object.keys(data).forEach(term => {
        
        const termData = data[term];
        
        const div = document.createElement("div");
        div.innerHTML = `<h4>${term}</h4>`;
        
        if (termData.subjects) {
            Object.keys(termData.subjects).forEach(sub => {
                
                const score = termData.subjects[sub];
                
                const row = document.createElement("div");
                row.className = "result-row";
                
                row.innerHTML = `
                    <span>${sub}: ${score}</span>
                    <span>
                        <button onclick="editResult('${id}','${term}','${sub}')">Edit</button>
                        <button onclick="deleteResult('${id}','${term}','${sub}')">Delete</button>
                    </span>
                `;
                
                div.appendChild(row);
            });
        }
        
        div.innerHTML += `
            <p>
                Average: ${termData.average || 0} | 
                Grade: ${termData.grade || 'N/A'} | 
                Comment: ${termData.comment || ''}
            </p>
        `;
        
        resDiv.appendChild(div);
    });
}

// ✅ Dashboard Analytics
function updateDashboardAnalytics(data){
    const total = Object.keys(data).length;
    document.getElementById("totalStudents").textContent = total;

    let top = {name:"N/A", avg:0};
    let totalGradeSum = 0, count =0;

    Object.keys(data).forEach(id=>{
        const res = data[id].results || {};
        Object.keys(res).forEach(term=>{
            const avg = Number(res[term].average) || 0;
            if(avg>top.avg){
                top = {name:data[id].studentName, avg};
            }
            if(avg>0){
                totalGradeSum += avg;
                count++;
            }
        });
    });

    document.getElementById("topStudent").textContent = top.name;
    document.getElementById("averageGrade").textContent = count>0 ? (totalGradeSum/count).toFixed(2) : "N/A";
}

window.uploadPhoto = async function() {
    
    const id = document.getElementById("studentID").value.trim();
    const input = document.getElementById("studentPhoto");
    const progressBar = document.getElementById("uploadProgress");

    if (!id) return alert("Enter Student ID first");
    if (!input.files.length) return alert("Choose photo");

   let file = null;

if (window.selectedFile) {
    file = window.selectedFile;
} else if (input.files.length > 0) {
    file = input.files[0];
}

if (!file) return alert("Choose photo");

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "episteme_upload");

    try {

        const xhr = new XMLHttpRequest();

        xhr.open("POST", "https://api.cloudinary.com/v1_1/du3egqkxh/image/upload");

        // 🔥 PROGRESS BAR
        xhr.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percent = (e.loaded / e.total) * 100;
                progressBar.style.width = percent + "%";
            }
        };

        xhr.onload = async function() {
            const data = JSON.parse(xhr.responseText);

            console.log("Cloudinary:", data);

            if (!data.secure_url) {
                throw new Error(data.error?.message || "Upload failed");
            }

            // 🔥 OPTIMIZED IMAGE (Auto resize)
            const optimizedUrl = data.secure_url.replace(
                "/upload/",
                "/upload/w_300,h_300,c_fill,q_auto/"
            );

            await update(ref(db, "students/" + id), {
                photoURL: optimizedUrl
            });

            progressBar.style.width = "100%";

            alert("Photo uploaded successfully");

        };

        xhr.onerror = () => {
            alert("Upload failed");
        };

        xhr.send(formData);

    } catch (err) {
        console.error(err);
        alert(err.message);
    }
};

    function renderAdminChart(data) {
    
    const canvas = document.getElementById("adminChart");
    if (!canvas) return;
    
    const ctx = canvas.getContext("2d");
    
    let labels = [];
    let values = [];
    
    Object.keys(data).forEach(id => {
        const student = data[id];
        if (student.results) {
            Object.keys(student.results).forEach(term => {
                labels.push(student.studentName + " (" + term + ")");
                values.push(Number(student.results[term].average) || 0);
            });
        }
    });
    
    if (window.adminChartInstance) {
        window.adminChartInstance.destroy();
    }
    
    window.adminChartInstance = new Chart(ctx, {
    type: "bar",
    data: {
        labels: labels,
        datasets: [{
            label: "Student Performance",
            data: values,
            backgroundColor: values.map(v => `rgba(102, 126, 234, 0.7)`),
            borderColor: values.map(v => `rgba(118, 75, 162, 1)`),

            borderRadius: 10, // Rounded bar edges

        }]

            },

    dropZone.style.borderColor = "#4b3cf0";
});

dropZone.addEventListener("dragleave", () => {
    dropZone.style.borderColor = "#ccc";
});

dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.style.borderColor = "#ccc";
    
    const file = e.dataTransfer.files[0];
    
    if (file) {
        preview.src = URL.createObjectURL(file);
        
        // ✅ DO NOT assign to input.files
        // Instead store file manually
